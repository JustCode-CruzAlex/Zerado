# nginx server config for zerado.app — the FALLBACK deploy path.
#
# Use this only if the App Platform static path is rejected (see
# ../digitalocean.md, "The decision"). It exists because it is the one path that
# honours site/public/_headers exactly and can send HSTS; App Platform can do
# neither for a static-site component.
#
# Assumes: smallest DigitalOcean droplet, Ubuntu 24.04, the built site rsynced
# to /var/www/zerado, and certbot's nginx plugin having issued the certificate:
#
#   sudo certbot --nginx -d zerado.app -d www.zerado.app
#
# certbot rewrites the listen/ssl_certificate lines below in place and installs
# a renewal timer. Renewal is automatic; verify once with
# `sudo certbot renew --dry-run`.

# --- apex, HTTPS ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name zerado.app;
    root /var/www/zerado;
    index index.html;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/zerado.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zerado.app/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- HSTS ------------------------------------------------------------
    # Two years, subdomains included. `preload` is present but the domain is NOT
    # submitted to the preload list until the deploy has been stable for a while
    # — preload is effectively irreversible.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- other security headers -------------------------------------------
    # The page is same-origin only: no client-side JavaScript, no external
    # requests, self-hosted fonts and inline SVG. The CSP below is therefore
    # tight on purpose; `unsafe-inline` for style-src is required because Astro
    # inlines the critical stylesheet.
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # --- compression ------------------------------------------------------
    # Brotli for text; WOFF2 is already Brotli-compressed internally and is
    # excluded deliberately (see ../../performance/performance-report.md F3).
    # Requires ngx_brotli; gzip is the floor if it is not installed.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types        text/html text/css text/plain image/svg+xml application/ld+json application/json;
    # brotli            on;
    # brotli_comp_level 6;
    # brotli_types      text/html text/css text/plain image/svg+xml application/ld+json application/json;

    # ======================================================================
    # Cache policy — a verbatim port of site/public/_headers.
    # Rule of thumb: only a content-hashed path may take a year-long
    # `immutable` cache.
    # ======================================================================

    # Astro's own bundle — the filename changes when the bytes change.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fonts are NOT content-hashed. Short max-age plus stale-while-revalidate so
    # a CDN serves instantly while revalidating, without risking a year-long
    # stale font if a subset is ever regenerated under the same filename.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Same-origin marks/icons — also unhashed, same reasoning, shorter floor.
    location ~* \.svg$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /og-card.png {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The document must always be revalidated so a new deploy is picked up
    # immediately — it is what references the hashed /_astro/* bundle.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # `_headers` itself is a host-config artefact, not page content.
    location = /_headers { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}

# --- www → apex, HTTPS ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zerado.app;

    # ssl_certificate     /etc/letsencrypt/live/zerado.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zerado.app/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 308 https://zerado.app$request_uri;
}

# --- HTTP → HTTPS --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zerado.app www.zerado.app;

    # Leave the ACME path reachable so renewals work.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 308 https://zerado.app$request_uri; }
}
