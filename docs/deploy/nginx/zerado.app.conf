# nginx server config for zerado.app — the PRIMARY deploy path.
#
# Chosen by the founder on 2026-08-25. It is the only path that honours
# site/public/_headers exactly and can send HSTS; App Platform static can do
# neither for a static-site component, which would have made three of ticket
# #1's acceptance criteria knowing deviations. See ../digitalocean.md.
#
# Assumes: smallest DigitalOcean droplet ($4.00/month), Ubuntu 24.04, the built
# site deployed by scripts/deploy.sh to /var/www/zerado/current (a symlink it
# swaps atomically), snippets/zerado-headers.conf installed at
# /etc/nginx/snippets/zerado-headers.conf, and — critically — the certificate
# ALREADY ISSUED before this file is ever installed:
#
#   certbot certonly --webroot -w /var/www/certbot -d zerado.app -d www.zerado.app
#
# THIS FILE CANNOT BE THE FIRST CONFIG ON THE BOX. It declares `listen ... ssl`
# with real certificate paths, and nginx treats a missing ssl_certificate as
# [emerg] — a fatal parse error, not a warning. certbot's nginx plugin runs its
# own `nginx -t` first, so a config nginx cannot load also blocks certbot from
# issuing the certificate that would fix it.
#
# zerado.app.bootstrap.conf breaks that cycle: install it first (HTTP only,
# serving the ACME webroot), issue the certificate, then swap this file in.
# docs/deploy/digitalocean.md steps 4 and 5 do exactly that, in order.
#
# Renewal is by systemd timer and is verified, not assumed:
# `certbot renew --dry-run`. Renewal uses the webroot plugin, so the ACME
# location block at the bottom of this file must stay.
#
# ── The one nginx trap this file is arranged around ──────────────────────
# A `location` that declares any `add_header` DISCARDS every `add_header`
# inherited from `server`. Inheritance is all-or-nothing. Every location below
# that sets its own Cache-Control therefore re-includes the full header set;
# none of them may set a header inline instead. Verify after deploying:
#
#   for p in / /index.html /_astro/ /fonts/ /logo.svg; do
#     echo "== $p"; curl -sI "https://zerado.app$p" \
#       | grep -iE 'cache-control|strict-transport|content-security|x-frame'
#   done

# --- apex, HTTPS ---------------------------------------------------------
server {
    # `listen ... http2` rather than the standalone `http2 on;` directive: the
    # latter needs nginx >= 1.25.1 and Ubuntu 24.04 LTS ships 1.24.0, where it is
    # an unknown directive and therefore a fatal parse error. This form works on
    # both (1.25+ accepts it with a deprecation warning).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name zerado.app;
    # `current` is a symlink the deploy swaps atomically — see scripts/deploy.sh.
    root /var/www/zerado/current;
    index index.html;

    # These paths must EXIST before nginx will load this file at all — a
    # `listen ... ssl` block with no certificate is [emerg], not a warning. That
    # is why the runbook installs zerado.app.bootstrap.conf first, issues the
    # certificate over HTTP, and only then swaps this file in.
    ssl_certificate     /etc/letsencrypt/live/zerado.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerado.app/privkey.pem;

    # Set explicitly rather than via /etc/letsencrypt/options-ssl-nginx.conf:
    # that file is written by certbot's *nginx installer*, and this deploy uses
    # `certbot certonly`, which never writes it. Including a file that may not
    # exist would reintroduce the same [emerg] this comment exists to prevent.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Applies to any location that does NOT declare an add_header of its own.
    include snippets/zerado-headers.conf;

    # --- compression ------------------------------------------------------
    # Brotli for text; WOFF2 is already Brotli-compressed internally and is
    # excluded deliberately (see ../../performance/performance-report.md F3).
    # Requires ngx_brotli; gzip is the floor if it is not installed.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    # text/html is NOT listed: nginx always gzips it and cannot be told otherwise,
    # so naming it here produces `[warn] duplicate MIME type "text/html"` on every
    # config test. Observed on nginx 1.24.0 during the first real deploy.
    gzip_types        text/css text/plain image/svg+xml application/ld+json application/json;
    # brotli            on;
    # brotli_comp_level 6;
    # brotli_types      text/css text/plain image/svg+xml application/ld+json application/json;

    # ======================================================================
    # Cache policy — a verbatim port of site/public/_headers.
    # Rule of thumb: only a content-hashed path may take a year-long
    # `immutable` cache.
    #
    # Every block re-includes the header set. Removing an include does not
    # weaken one header — it removes all seven from that route.
    # ======================================================================

    # Astro's own bundle — the filename changes when the bytes change.
    location ^~ /_astro/ {
        include snippets/zerado-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fonts are NOT content-hashed. Short max-age plus stale-while-revalidate so
    # a CDN serves instantly while revalidating, without risking a year-long
    # stale font if a subset is ever regenerated under the same filename.
    location ^~ /fonts/ {
        include snippets/zerado-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # Game cover art from IGDB, served from this origin so the page keeps making
    # zero external requests. Not content-hashed, and IGDB does replace cover
    # art, so the fonts' stale-while-revalidate shape rather than `immutable`.
    location ^~ /covers/ {
        include snippets/zerado-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # Same-origin marks/icons — also unhashed, same reasoning, shorter floor.
    location ~* \.svg$ {
        include snippets/zerado-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /og-card.png {
        include snippets/zerado-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The document must always be revalidated so a new deploy is picked up
    # immediately — it is what references the hashed /_astro/* bundle.
    # `/` and `/index.html` address the same document and must be identical.
    location = / {
        include snippets/zerado-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include snippets/zerado-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # `_headers` itself is a host-config artefact, not page content.
    location = /_headers { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}

# --- www → apex, HTTPS ---------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zerado.app;

    # Same certificate — it covers both names (SAN).
    ssl_certificate     /etc/letsencrypt/live/zerado.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerado.app/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    include snippets/zerado-headers.conf;
    return 308 https://zerado.app$request_uri;
}

# --- HTTP → HTTPS --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zerado.app www.zerado.app;

    # Leave the ACME path reachable so renewals work.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 308 https://zerado.app$request_uri; }
}
