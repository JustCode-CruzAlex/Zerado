# BOOTSTRAP config for zerado.app — HTTP only, used exactly once.
#
# Why this file exists: the full config (zerado.app.conf) declares
# `listen 443 ssl` with real `ssl_certificate` paths. Before the certificate
# exists, nginx refuses to start at all —
#
#   nginx: [emerg] no "ssl_certificate" is defined for the "listen ... ssl" directive
#
# — which is a fatal parse error, not a warning. And certbot's nginx plugin runs
# its own `nginx -t` in prepare(), so a config nginx cannot load also blocks
# certbot from issuing the certificate that would fix it. Chicken and egg.
#
# This config breaks it: HTTP only, no TLS directives, serving the ACME webroot.
# nginx loads it, certbot validates over port 80 and writes the certificate, and
# only then does the full config go in.
#
# Install at /etc/nginx/sites-available/zerado.app for step 4, then REPLACE it
# with zerado.app.conf in step 5. It is not the running config for more than a
# few minutes.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zerado.app www.zerado.app;

    # The only thing that matters here: certbot's HTTP-01 challenge files.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # A holding response for anything else, so the box is not silently blank
    # while the certificate is being issued. No redirect to HTTPS yet — there is
    # no HTTPS yet, and redirecting to a dead port would break the ACME check.
    location / {
        return 200 "zerado.app — provisioning\n";
        default_type "text/plain";
    }
}
