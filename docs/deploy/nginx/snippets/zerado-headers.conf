# The complete Zerado security-header set, in one file, because nginx makes this
# a trap: a `location` block that declares ANY `add_header` of its own discards
# EVERY `add_header` inherited from the enclosing `server`. Inheritance is
# all-or-nothing, not additive.
#
# So every location that needs to set its own Cache-Control must also re-include
# this file, or it silently ships with no CSP and no frame protection while the
# route next to it is fully protected.
#
#   include snippets/zerado-headers.conf;
#
# Install at /etc/nginx/snippets/zerado-headers.conf.

# Two years, subdomains included. `preload` is present but the domain is NOT
# submitted to the preload list until the deploy has been stable for a while —
# preload is effectively irreversible.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# The page is same-origin only: no client-side JavaScript, no external requests,
# self-hosted fonts and inline SVG. `unsafe-inline` for style-src is required
# because Astro inlines the critical stylesheet.
add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
