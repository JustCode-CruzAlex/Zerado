[[free]]
text = "Esc = back one level, everywhere. In a text input it blurs first and keeps what was typed. In filter mode the first Esc leaves the editor and KEEPS the filter; the second clears it — and the footer says so at the moment it matters."
color = "fg2"
x = 200
y = 1060
w = 1700

[[free]]
text = "q = quit, from anywhere, immediately. There is nothing to confirm: every mutation commits when it is made. A confirmation with nothing behind it teaches people to dismiss confirmations."
color = "fg2"
x = 200
y = 1120
w = 1700

[[free]]
text = ":  and  Ctrl-K  are RESERVED and UNBOUND in Phase 1, so the Phase 2 command palette can claim them without retraining anyone. Pressing either does nothing, and shows no error."
color = "gold"
x = 200
y = 1180
w = 1700

[[free]]
text = "Focus is carried by THREE channels and any two are enough: position (a ▌ marker in the left gutter), weight (bold), colour (amber). Under NO_COLOR the first two survive. The focus ring is never removed."
color = "accent"
x = 200
y = 1240
w = 1700
