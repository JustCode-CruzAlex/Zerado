style = "solid"
from_side = "r"
to_side = "l"

[[edge]]
from = "row74"
to = "why2"
style = "solid"
from_side = "b"
to_side = "t"

[[free]]
text = "BodyRect.h = 24 − HeaderBandHeight (3) − footer (1) − 2·OuterMarginY (2) − InnerPaddingY (1) − InterElementGap (1) = 16"
color = "accent"
x = 140
y = 1200
w = 1850

[[free]]
text = "80 × 24 is the design width and the guaranteed floor. Every screen is composed at 74 × 16 first and enhanced upward. A screen that only reads well at 120 columns is not finished; a screen that REQUIRES more than 80 is a defect."
color = "fg2"
x = 140
y = 1255
w = 1850
