  "every visible row begins at COLUMN 4",
  "header-left == content-left  — the whole point of #2435",
  "BodyRect.w = 80 − 2·leftInset = 74",
]
color = "gold"
shape = "rect"
x = 1370
y = 210
w = 620
h = 220

[[node]]
id = "row74"
title = "THE 74-COLUMN GAME ROW"
sublines = [
  "focus field       2    fixed, width-aware padded",
  "state chip       14    glyph field 2 + space + label",
  "gutter            2",
  "TITLE            42    the identity column, R-10(a)",
  "gutter            2",
  "playtime          6    right-aligned",
  "gutter            2",
  "source            4    STM / PHY",
  "                 ──",
  "                 74",
]
color = "accent"
shape = "rect"
x = 1370
y = 460
w = 620
h = 380

[[node]]
id = "why2"
title = "WHY THE GLYPH FIELD IS 2 COLUMNS"
sublines = [
  "○ U+25CB and ◐ U+25D0 are AMBIGUOUS width.",
  "◉ U+25C9 and ⊘ U+2298 are Neutral.",
  "Ambiguous = 1 cell in most terminals, 2 where",
  "the user set ambiguous-width=double. A 1-column",
  "budget would shear the state column on a real",
  "class of terminals — on the most-used component",
  "in the product. Fixed in RENDERING, never by",
  "changing the ratified glyphs.",
]
color = "err"
shape = "rect"
x = 1370
y = 870
w = 620
h = 300

[[edge]]
