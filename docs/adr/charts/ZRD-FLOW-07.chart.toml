[[free]]
text = "STREAMED, NEVER BUNDLED. Music is internet radio the player chooses; nothing ships in the binary, so there is nothing to license. The two channels differ: interface FX are WORKS (local, always), radio NEEDS THE NETWORK and stops offline."
color = "ok"
x = 90
y = 1260
w = 1850

[[free]]
text = "The default BUILD contains NullAudio and stays pure Go, so the cross-compile matrix survives and the silent path is the one every test run exercises. The real player sits behind a build tag."
color = "accent"
x = 90
y = 1315
w = 1850
