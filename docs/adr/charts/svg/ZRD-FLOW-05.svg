<text x="100.0" y="970.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#9D7BFF" text-anchor="start" font-weight="normal">A screen never talks to a provider. A provider never talks to a screen. Between them sits the Store — which is why the offline contract is STRUCTURAL rather than a feature that had to be added.</text>
<text x="100.0" y="1030.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#22C55E" text-anchor="start" font-weight="normal">Everything downstream reads Capabilities, never ProviderID. An is_physical boolean would force every new feature to remember a special case — and eventually one would not.</text>
