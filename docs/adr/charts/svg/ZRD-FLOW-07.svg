<text x="60" y="78" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#FAFAFA">FLOW  ·  THE AUDIO SUBSYSTEM</text>
<text x="61" y="102" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="13.5" fill="#94A3B8">off by default · streamed radio, nothing bundled · silent on every failure</text>
<polyline points="490.0,320.0 610.0,310.0" fill="none" stroke="#94A3B8" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
