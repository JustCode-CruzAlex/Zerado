<text x="290.0" y="297.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">a screen emits a CUE</text>
<text x="290.0" y="315.5" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">Cue(&quot;sync.done&quot;)</text>
<text x="290.0" y="334.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">semantic, never a file name</text>
<text x="290.0" y="352.5" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">cannot fail · cannot block</text>
<polygon points="770.0,200.0 930.0,310.0 770.0,420.0 610.0,310.0" fill="#0F0F23" stroke="#F59E0B" stroke-width="2.0"/>
<text x="770.0" y="314.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">audio enabled?</text>
<polygon points="770.0,560.0 930.0,670.0 770.0,780.0 610.0,670.0" fill="#0F0F23" stroke="#F59E0B" stroke-width="2.0"/>
<text x="770.0" y="674.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">available?</text>
<polygon points="770.0,920.0 930.0,1030.0 770.0,1140.0 610.0,1030.0" fill="#0F0F23" stroke="#F59E0B" stroke-width="2.0"/>
<text x="770.0" y="1034.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">channel muted?</text>
<rect x="1080.0" y="200.0" width="620.0" height="240.0" rx="12" ry="12" fill="#0F0F23" stroke="#22C55E" stroke-width="2.0"/>
<text x="1390.0" y="287.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">PLAY</text>
<text x="1390.0" y="306.3" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">buffered channel, non-blocking send</text>
<text x="1390.0" y="324.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">buffer full  -&gt;  the CUE IS DROPPED</text>
<text x="1390.0" y="343.2" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">a missed sound is never worth a dropped frame</text>
<text x="1390.0" y="361.7" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">one owned goroutine, stopped by ctx</text>
<rect x="1080.0" y="620.0" width="620.0" height="220.0" rx="12" ry="12" fill="#0F0F23" stroke="#A0A0B0" stroke-width="2.0"/>
<text x="1390.0" y="707.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">SILENCE</text>
<text x="1390.0" y="725.5" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">not an error · not a banner · not a nag</text>
<text x="1390.0" y="744.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">the visible signal already happened</text>
<text x="1390.0" y="762.5" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">said ONCE, in Z-09 Settings, and never again</text>
<rect x="1080.0" y="940.0" width="620.0" height="280.0" rx="12" ry="12" fill="#0F0F23" stroke="#EF4444" stroke-width="2.0"/>
<text x="1390.0" y="1038.6" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">WHY it is unavailable  —  Z-09 says which</text>
<text x="1390.0" y="1057.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">ZERADO_NO_AUDIO set   -&gt;  OVERRIDDEN, not &#x27;off&#x27;</text>
<text x="1390.0" y="1075.5" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">no audio device</text>
<text x="1390.0" y="1094.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">over SSH   -&gt;  the sound would play on the wrong machine</text>
<text x="1390.0" y="1112.5" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">in CI</text>
<text x="1390.0" y="1131.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">init failed or timed out</text>
<rect x="90.0" y="560.0" width="400.0" height="240.0" rx="12" ry="12" fill="#0F0F23" stroke="#7D56F4" stroke-width="2.0"/>
<text x="290.0" y="647.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">OFF BY DEFAULT</text>
<text x="290.0" y="666.3" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">explicit opt-in in Z-09</text>
<text x="290.0" y="684.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">nothing plays on first run</text>
<text x="290.0" y="703.2" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">so WCAG 1.4.2 is satisfied</text>
<text x="290.0" y="721.7" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">before its 3s threshold, not after</text>
<rect x="90.0" y="920.0" width="400.0" height="240.0" rx="12" ry="12" fill="#0F0F23" stroke="#7D56F4" stroke-width="2.0"/>
<text x="290.0" y="1007.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14" fill="#FAFAFA" text-anchor="middle" font-weight="600">m   —   GLOBAL MUTE</text>
<text x="290.0" y="1026.3" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">always reachable, every screen</text>
<text x="290.0" y="1044.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">music and FX mute INDEPENDENTLY</text>
<text x="290.0" y="1063.2" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">muting music RELEASES the device;</text>
<text x="290.0" y="1081.7" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">it does not hold a gain of zero</text>
<rect x="987.2" y="304.0" width="35.6" height="20" rx="6" fill="#000000" stroke="#94A3B8" stroke-width="1" opacity="1"/>
<text x="1005.0" y="319.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">yes</text>
<rect x="753.0" y="479.0" width="34.0" height="20" rx="6" fill="#000000" stroke="#94A3B8" stroke-width="1" opacity="1"/>
<text x="770.0" y="494.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">no</text>
<rect x="988.0" y="689.0" width="34.0" height="20" rx="6" fill="#000000" stroke="#94A3B8" stroke-width="1" opacity="1"/>
<text x="1005.0" y="704.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">no</text>
<rect x="752.2" y="839.0" width="35.6" height="20" rx="6" fill="#000000" stroke="#94A3B8" stroke-width="1" opacity="1"/>
<text x="770.0" y="854.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">yes</text>
<rect x="980.0" y="1044.0" width="50.0" height="20" rx="6" fill="#000000" stroke="#94A3B8" stroke-width="1" opacity="1"/>
<text x="1005.0" y="1059.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">muted</text>
<text x="90.0" y="1260.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#22C55E" text-anchor="start" font-weight="normal">STREAMED, NEVER BUNDLED. Music is internet radio the player chooses; nothing ships in the binary, so there is nothing to license. The two channels differ: interface FX are WORKS (local, always), radio NEEDS THE NETWORK and stops offline.</text>
<text x="90.0" y="1315.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#9D7BFF" text-anchor="start" font-weight="normal">The default BUILD contains NullAudio and stays pure Go, so the cross-compile matrix survives and the silent path is the one every test run exercises. The real player sits behind a build tag.</text>
