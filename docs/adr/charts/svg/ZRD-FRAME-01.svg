<text x="1680.0" y="969.3" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">○ U+25CB and ◐ U+25D0 are AMBIGUOUS width.</text>
<text x="1680.0" y="987.8" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">◉ U+25C9 and ⊘ U+2298 are Neutral.</text>
<text x="1680.0" y="1006.3" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">Ambiguous = 1 cell in most terminals, 2 where</text>
