<text x="140.0" y="1200.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#9D7BFF" text-anchor="start" font-weight="normal">BodyRect.h = 24 − HeaderBandHeight (3) − footer (1) − 2·OuterMarginY (2) − InnerPaddingY (1) − InterElementGap (1) = 16</text>
<text x="140.0" y="1255.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="start" font-weight="normal">80 × 24 is the design width and the guaranteed floor. Every screen is composed at 74 × 16 first and enhanced upward. A screen that only reads well at 120 columns is not finished; a screen that REQUIRES more than 80 is a defect.</text>
