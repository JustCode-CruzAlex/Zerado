<text x="1680.0" y="1043.2" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">budget would shear the state column on a real</text>
<text x="1680.0" y="1061.7" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">class of terminals — on the most-used component</text>
<text x="1680.0" y="1080.2" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">in the product. Fixed in RENDERING, never by</text>
