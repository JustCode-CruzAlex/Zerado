<text x="80.0" y="1270.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="start" font-weight="normal">Zerado does NOT probe for connectivity. No heartbeat, no reachability check — that would be exactly the background traffic the page promises does not exist, and it is unreliable anyway. A request fails, and the failure is classified.</text>
<text x="80.0" y="1330.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#EF4444" text-anchor="start" font-weight="normal">Any value that came from the network is rendered with its age. ALWAYS.   &quot;$15&quot; is forbidden.   &quot;$15 · 3 days ago&quot; is required. Zerado&#x27;s value is telling a player NOT to buy; a stale price shown as current is advice from memory.</text>
