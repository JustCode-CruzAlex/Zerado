<text x="1580.0" y="1268.2" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" fill="#FAFAFA" text-anchor="middle" font-weight="400">the library below it still works, completely</text>
<text x="80.0" y="1400.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#EF4444" text-anchor="start" font-weight="normal">Steam returned an empty library. Game details are private on your profile — Steam won&#x27;t share the list until that&#x27;s public. Settings → Privacy.</text>
<text x="80.0" y="1460.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="start" font-weight="normal">Not: &quot;Something went wrong.&quot; That is the one sentence a terminal user cannot act on. Every refusal names what happened, why, and what to do next.</text>
