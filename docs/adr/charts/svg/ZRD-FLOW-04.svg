<text x="680.0" y="604.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">,</text>
<rect x="663.0" y="719.0" width="34.0" height="20" rx="6" fill="#000000" stroke="#94A3B8" stroke-width="1" opacity="1"/>
<text x="680.0" y="734.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">a</text>
<rect x="1303.0" y="429.0" width="34.0" height="20" rx="6" fill="#000000" stroke="#94A3B8" stroke-width="1" opacity="1"/>
<text x="1320.0" y="444.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">?</text>
<text x="200.0" y="1060.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="start" font-weight="normal">Esc = back one level, everywhere. In a text input it blurs first and keeps what was typed. In filter mode the first Esc leaves the editor and KEEPS the filter; the second clears it — and the footer says so at the moment it matters.</text>
<text x="200.0" y="1120.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="start" font-weight="normal">q = quit, from anywhere, immediately. There is nothing to confirm: every mutation commits when it is made. A confirmation with nothing behind it teaches people to dismiss confirmations.</text>
<text x="200.0" y="1180.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#F59E0B" text-anchor="start" font-weight="normal">:  and  Ctrl-K  are RESERVED and UNBOUND in Phase 1, so the Phase 2 command palette can claim them without retraining anyone. Pressing either does nothing, and shows no error.</text>
<text x="200.0" y="1240.0" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" fill="#9D7BFF" text-anchor="start" font-weight="normal">Focus is carried by THREE channels and any two are enough: position (a ▌ marker in the left gutter), weight (bold), colour (amber). Under NO_COLOR the first two survive. The focus ring is never removed.</text>
