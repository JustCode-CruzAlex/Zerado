<rect x="663.0" y="454.0" width="34.0" height="20" rx="6" fill="#000000" stroke="#94A3B8" stroke-width="1" opacity="1"/>
<text x="680.0" y="469.0" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">r</text>
