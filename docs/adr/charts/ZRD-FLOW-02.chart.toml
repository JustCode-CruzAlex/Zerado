[[free]]
text = "ONE transition is automatic: NOT STARTED → IN PROGRESS, when a sync reports playtime > 0 on a game whose status_manual is NULL. Every other arrow on this sheet is the player."
color = "gold"
x = 180
y = 940
w = 1600

[[free]]
text = "A SYNC NEVER WRITES status_manual. Mark a game ZERADO, then play three more hours: playtime updates, last_played_at updates, the state does not. That invariant is what makes the product trustworthy."
color = "err"
x = 180
y = 1000
w = 1600

[[free]]
text = "ZERADO is never inferred. 100% achievements may SUGGEST it in Phase 2 — a dismissible line the player accepts. A machine cannot hand someone the moment the product exists to create."
color = "accent"
x = 180
y = 1060
w = 1600

[[free]]
text = "All twelve ordered pairs are legal. For providers with no playtime capability — physical copies, and any store whose API does not report it — all four states are manual, always."
color = "fg2"
x = 180
y = 1120
w = 1600
