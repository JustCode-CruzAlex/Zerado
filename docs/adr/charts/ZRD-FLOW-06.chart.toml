[[free]]
text = "Zerado does NOT probe for connectivity. No heartbeat, no reachability check — that would be exactly the background traffic the page promises does not exist, and it is unreliable anyway. A request fails, and the failure is classified."
color = "fg2"
x = 80
y = 1270
w = 1820

[[free]]
text = "Any value that came from the network is rendered with its age. ALWAYS.   \"$15\" is forbidden.   \"$15 · 3 days ago\" is required. Zerado's value is telling a player NOT to buy; a stale price shown as current is advice from memory."
color = "err"
x = 80
y = 1330
w = 1820
