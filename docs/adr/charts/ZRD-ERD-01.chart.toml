schema_version = 1

[chart]
name = "ZRD-ERD-01"
title = "ZERADO — DATA MODEL  ·  SHEET 1"
subtitle = "the Phase 1 core — a media item, its typed extension, and what is deliberately outside the file"
width = 1820
height = 1530

[titleblock]
dwg_title = "ZERADO DATA MODEL - PHASE 1 CORE"
discipline = "ARCHITECTURE"
sheet = "01 OF 10"
dwg_no = "ADR-0001"
rev = "A"
date = "2026-08-25"
status = "DRAFT"
description = "Conceptual model. Games first, not games only."
project = "Zerado"
author = "fft-tui-architect"

[[zone]]
title = "library.db  —  ONE FILE, and the promise is that it stays one"
color = "brand"
x = 70
y = 150
w = 1630
h = 750

[[node]]
id = "item"
title = "media_item"
sublines = [
  "id                    PK",
  "media_uid             merge hint, INDEXED not unique",
  "media_type            'game' in Phase 1, CONSTRAINED to it",
  "provider_id + provider_ref      UNIQUE",
  "acquisition           digital | physical",
  "title · sort_title · platform",
  "progress_value / _unit / _source",
  "last_used_at          NULL = not reported",
  "status_manual         NULL = derive on read",
  "status_changed_at · rating · notes",
  "absent_since          tombstone — NEVER a delete",
  "merged_into           Phase 4 merge, never rewrites keys",
]
color = "accent"
shape = "cyl"
x = 110
y = 200
w = 520
h = 450

[[node]]
id = "game"
title = "media_game        — the typed extension"
sublines = [
  "media_item_id         PK / FK",
  "steam_appid",
  "achievements_total · achievements_unlocked",
]
color = "ok"
shape = "rect"
x = 110
y = 690
w = 520
h = 175

[[node]]
id = "conn"
title = "provider_connection"
sublines = [
  "provider_id           PK",
  "account_ref",
  "connected_at",
  "last_sync_at · last_sync_status",
]
color = "brand"
shape = "cyl"
x = 700
y = 200
w = 450
h = 250

[[node]]
id = "syncrun"
title = "sync_run"
sublines = [
  "id PK  ·  provider_id FK",
  "started_at · finished_at",
  "status  ok | partial | failed | cancelled",
  "items_seen · new · changed",
  "error",
]
color = "brand"
shape = "rect"
x = 700
y = 520
w = 450
h = 250

[[node]]
id = "setting"
title = "setting"
sublines = ["key  PK", "value"]
color = "muted"
shape = "rect"
x = 1220
y = 200
w = 240
h = 150

[[node]]
id = "migration"
title = "schema_migration"
sublines = ["version  PK", "applied_at"]
color = "muted"
shape = "rect"
x = 1220
y = 400
w = 290
h = 150

[[node]]
id = "vault"
title = "Vault   —   NOT in the library file"
sublines = [
  "OS keychain, or credentials.json mode 0600",
  "the player's own API keys",
  "never backed up with the library, never synced",
]
color = "err"
shape = "rect"
x = 340
y = 990
w = 630
h = 190

[[node]]
id = "cache"
title = "XDG cache   —   NOT in the library file"
sublines = [
  "cover-art blobs (Phase 2)",
  "disposable, refetchable, OS may delete it",
  "keeps the backed-up file small enough to back up",
]
color = "muted"
shape = "rect"
x = 1030
y = 990
w = 630
h = 190

[[edge]]
from = "item"
to = "game"
label = "1 : 1"
style = "solid"
from_side = "b"
to_side = "t"

[[edge]]
from = "item"
to = "conn"
label = "provider_id    N : 1"
style = "solid"
from_side = "r"
to_side = "l"

[[edge]]
from = "conn"
to = "syncrun"
label = "1 : N"
style = "solid"
from_side = "b"
to_side = "t"

[[edge]]
from = "conn"
to = "vault"
label = "keys"
style = "dashed"
from_side = "l"
to_side = "t"

[[free]]
text = "media_book · media_film · media_series are NOT built in Phase 1. They are named so the shape is visibly extensible — and so finding F-1 (film and series are two types, not one) is not rediscovered later."
color = "ok"
x = 110
y = 935
w = 1560

[[free]]
text = "effective_status is NOT stored. It is derived on read:  status_manual ?? derive(progress, capabilities).  ONE function, every media type — see 11-media-model.md."
color = "accent"
x = 110
y = 1250
w = 1560

[[free]]
text = "KEY    violet = the media item    ·    green = its typed extension    ·    blue = sync bookkeeping    ·    grey = local-only, never syncs    ·    red = deliberately OUTSIDE the library file"
color = "fg2"
x = 110
y = 1305
w = 1560
