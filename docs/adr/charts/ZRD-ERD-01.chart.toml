schema_version = 1

[chart]
name = "ZRD-ERD-01"
title = "ZERADO — DATA MODEL  ·  SHEET 1"
subtitle = "the Phase 1 core — a games model that has not painted itself into a corner"
width = 1820
height = 1430

[titleblock]
dwg_title = "ZERADO DATA MODEL - PHASE 1 CORE"
discipline = "ARCHITECTURE"
sheet = "01 OF 10"
dwg_no = "ADR-0001"
rev = "A"
date = "2026-08-25"
status = "DRAFT"
description = "Phase 1 games schema. Credentials and art live outside the file."
project = "Zerado"
author = "fft-tui-architect"

[[zone]]
title = "library.db  —  ONE FILE, and the promise is that it stays one"
color = "brand"
x = 70
y = 150
w = 1630
h = 630

[[node]]
id = "item"
title = "item"
sublines = [
  "id                  PK",
  "item_uid            merge hint, INDEXED not unique",
  "item_type           'game' — CHECKed. The whole door-open affordance",
  "provider_id + provider_ref     UNIQUE",
  "acquisition         digital | physical",
  "title · sort_title · platform",
  "playtime_minutes    INT NOT NULL — zero is a real value",
  "last_played_at      NULL = not reported",
  "steam_appid · achievements_total / _unlocked",
  "status_manual       NULL = derive on read",
  "status_changed_at · rating · notes",
  "absent_since        tombstone — NEVER a delete",
  "merged_into         Phase 4 merge, never rewrites keys",
]
color = "accent"
shape = "cyl"
x = 110
y = 195
w = 570
h = 530

[[node]]
id = "conn"
title = "provider_connection"
sublines = [
  "provider_id           PK",
  "account_ref",
  "connected_at",
  "last_sync_at · last_sync_status",
]
color = "brand"
shape = "cyl"
x = 750
y = 195
w = 450
h = 250

[[node]]
id = "syncrun"
title = "sync_run"
sublines = [
  "id PK  ·  provider_id FK",
  "started_at · finished_at",
  "status  ok | partial | failed | cancelled",
  "items_seen · new · changed",
  "error",
]
color = "brand"
shape = "rect"
x = 750
y = 475
w = 450
h = 250

[[node]]
id = "setting"
title = "setting"
sublines = ["key  PK", "value"]
color = "muted"
shape = "rect"
x = 1260
y = 195
w = 240
h = 150

[[node]]
id = "migration"
title = "schema_migration"
sublines = ["version  PK", "applied_at"]
color = "muted"
shape = "rect"
x = 1260
y = 395
w = 290
h = 150

[[node]]
id = "vault"
title = "Vault   —   NOT in the library file"
sublines = [
  "OS keychain, or credentials.json mode 0600",
  "the player's own API keys",
  "never backed up with the library, never synced",
]
color = "err"
shape = "rect"
x = 380
y = 900
w = 620
h = 190

[[node]]
id = "cache"
title = "XDG cache   —   NOT in the library file"
sublines = [
  "cover-art blobs (Phase 2)",
  "disposable, refetchable, OS may delete it",
  "keeps the backed-up file small enough to back up",
]
color = "muted"
shape = "rect"
x = 1060
y = 900
w = 620
h = 190

[[edge]]
from = "item"
to = "conn"
label = "provider_id    N : 1"
style = "solid"
from_side = "r"
to_side = "l"

[[edge]]
from = "conn"
to = "syncrun"
label = "1 : N"
style = "solid"
from_side = "b"
to_side = "t"

[[edge]]
from = "conn"
to = "vault"
label = "keys"
style = "dashed"
from_side = "l"
to_side = "t"

[[free]]
text = "THE DOOR-OPEN AFFORDANCE IS TWO DECISIONS: item_type exists and is CHECKed to 'game', and the table is not called games. Nothing else is generalised. Game facts live on the item; there is no typed extension and no generic progress, because there is no second type to separate them from."
color = "ok"
x = 110
y = 830
w = 1560

[[free]]
text = "effective_status is NOT stored. It is derived on read:  status_manual ?? derive(playtime_minutes, capabilities)."
color = "accent"
x = 110
y = 1140
w = 1560

[[free]]
text = "KEY    violet = the item    ·    blue = sync bookkeeping    ·    grey = local-only, never syncs    ·    red = deliberately OUTSIDE the library file"
color = "fg2"
x = 110
y = 1195
w = 1560

[[free]]
text = "library.db  —  ONE FILE, and the promise is that it stays one"
color = "brand"
x = 92
y = 178
w = 900
