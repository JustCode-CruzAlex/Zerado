from_side = "b"
to_side = "t"

[[free]]
text = "THE LINE IS A TABLE BOUNDARY, NOT A CONVENTION."
color = "ok"
x = 100
y = 1250
w = 1740

[[free]]
text = "A sync writes item, and only item. It cannot destroy a status, a note or a rating, because the UPSERT statement cannot NAME a column in item_user."
color = "ok"
x = 100
y = 1280
w = 1740

[[free]]
text = "A physical row needs no separate guard: physical implements Provider and NOT Syncer, so no sync statement ever reaches it. D1 is what makes this rule enforceable."
color = "ok"
x = 100
y = 1308
w = 1740

[[free]]
text = "Measured cost of the split: +9.8 us on the root screen's page query, +128 us on a whole cold open of 400 titles. Cold open total: 842 us."
color = "ok"
x = 100
y = 1336
w = 1740

[[free]]
text = "NO FK FROM item.provider_id TO provider_connection - DELIBERATELY."
color = "err"
x = 100
y = 1394
w = 1740

[[free]]
text = "A connection is a relationship the player can END; the library outlives it. An FK would force a choice between deleting a library on"
color = "err"
x = 100
y = 1422
w = 1740

[[free]]
text = "disconnect and forbidding disconnect while items exist. Both are wrong, so there is no FK. The association resolves in code, against"
color = "err"
x = 100
y = 1450
w = 1740

[[free]]
text = "the compiled-in provider registry - which ADR-0001 D1 makes the authority anyway (Capabilities, never the database)."
color = "err"
x = 100
y = 1478
w = 1740

[[free]]
text = "KEY   violet = identity and provider replica   ·   green = TRUTH, only the player writes it   ·   gold = CACHE, safe to discard, every"
color = "fg2"
x = 100
y = 1536
w = 1740

[[free]]
text = "row stamped with its age   ·   blue = sync bookkeeping   ·   grey = local-only, never syncs   ·   red = outside the library file"
color = "fg2"
x = 100
y = 1564
w = 1740
