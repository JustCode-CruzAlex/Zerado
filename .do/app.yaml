# DigitalOcean App Platform — Zerado landing page (static site component).
#
# Every field below is at the ROOT of the document. There is no `spec:` wrapper:
# that key exists only in the API request body, never in the file consumed by
# `--spec` or auto-detected at .do/app.yaml.
# Reference: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Apply with:
#   doctl apps spec validate .do/app.yaml           # check before creating
#   doctl apps create --spec .do/app.yaml           # first time
#   doctl apps update <APP_ID> --spec .do/app.yaml  # thereafter
#
# Deploys are automatic after that: `deploy_on_push` makes App Platform rebuild
# and republish on every push to `main` that lands in this repository. There is
# no manual step and no DigitalOcean token stored in GitHub — App Platform pulls
# from GitHub through its own installed GitHub App.
#
# Read docs/deploy/digitalocean.md before applying. It carries the confirmed
# price, the DNS steps, and the two header limitations this platform has.

name: zerado
region: nyc

features:
  - buildpack-stack=ubuntu-22

# Nothing here is attended. Tell someone when a deploy or a domain fails.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

static_sites:
  - name: site
    # --- source ---
    github:
      repo: JustCode-CruzAlex/Zerado
      branch: main
      deploy_on_push: true
    source_dir: /site

    # --- build ---
    # `npm ci` installs strictly from site/package-lock.json, so the build is
    # reproducible and needs nothing but the npm registry.
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: /dist
    index_document: index.html
    # The page is a single route; anything else is a genuine 404 rather than a
    # SPA fallback. No catchall_document on purpose.
    error_document: index.html

    envs:
      - key: NODE_VERSION
        scope: BUILD_TIME
        value: '22'

domains:
  - domain: zerado.app
    type: PRIMARY
    zone: zerado.app
  - domain: www.zerado.app
    type: ALIAS
    zone: zerado.app

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: site
